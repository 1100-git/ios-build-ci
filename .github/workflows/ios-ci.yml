# .github/workflows/ios-ci.yml
# iOS CI/CD: lint + secrets scan on Linux, build/test/archive on macOS,
# then deploy to "staging" and "production" with manual approval via GitHub Environments.
#
# Third-party actions are pinned to commit SHAs (the version is in the trailing comment).

name: iOS CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs to save macOS minutes.
# Runs on main are never cancelled, so an in-progress deploy is not killed mid-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Adjust for your project (check with: xcodebuild -list)
  XCODE_CONTAINER: "-project Examples/SyncUps/SyncUps.xcodeproj"
  SCHEME: "SyncUps"

jobs:
  # ---------- 1. Cheap checks on Linux (1x minutes) ----------
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Same command as upstream `make format`; fails if it changes anything.
    # (`swift format lint --strict` is not used: it also enforces naming rules upstream doesn't follow.)
    container: swift:6.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: swift-format check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          find . \
            -path '*/Documentation.docc' -prune -o \
            -name '*.swift' \
            -not -path '*/.*' -print0 \
            | xargs -0 swift format --ignore-unparsable-files --in-place --parallel
          git diff --exit-code || { echo "::error::Code is not formatted. Run 'make format' locally and commit the result."; exit 1; }

  secrets-scan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Free for personal accounts; repos owned by an organization need a GITLEAKS_LICENSE secret
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 2. Build and test on macOS (10x minutes in private repos) ----------
  build-test:
    needs: [lint, secrets-scan]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Xcode version
        run: xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick simulator
        id: sim
        run: |
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if ".iOS-" in k),
                       key=lambda k: [int(p) for p in k.split("iOS-")[1].split("-")])
          for k in reversed(ios):
              for x in d[k]:
                  if x["name"].startswith("iPhone"):
                      print(x["udid"]); sys.exit()
          sys.exit("No iPhone simulator found")
          ')
          echo "Using simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild test \
            $XCODE_CONTAINER \
            -scheme "$SCHEME" \
            -only-testing:SyncUpsTests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build/DerivedData \
            -resultBundlePath TestResults.xcresult \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
          retention-days: 7

  # ---------- 3. Unsigned archive as a "release candidate" ----------
  archive:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # TODO: unsigned archives cannot be uploaded to TestFlight / App Store —
      # add code signing (fastlane match or a .p12 + provisioning profile) and export an .ipa.
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            $XCODE_CONTAINER \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath build/SyncUps.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee archive.log | xcbeautify --renderer github-actions

      - name: Upload archive log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-log
          path: archive.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-archive
          path: build/SyncUps.xcarchive
          retention-days: 7

  # ---------- 4. Staging / Production with manual approval ----------
  # Create in Settings → Environments: "staging" and "production".
  # For production, add Required reviewers (yourself) — that is the manual approval.
  # Both jobs deploy the same artifact: build once, promote it.
  deploy-staging:
    needs: archive
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-archive
      - run: echo "TestFlight / Firebase App Distribution for staging goes here"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-archive
      - run: echo "App Store Connect upload after approval goes here"
